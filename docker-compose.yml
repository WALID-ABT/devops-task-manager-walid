services:
  # API service (Task Manager)
  api:
    image: ghcr.io/kanass20/task-manager-api:prod 
    ports:
      - "3000:3000" 
    depends_on:
      - db 
    environment:
      - MONGO_URL=mongodb://db:27017/tasksdb

  # Database service (MongoDB)
  db:
    image: mongo:6 
    volumes:
      - mongo_data:/data/db

# Named volumes definition
volumes:
  mongo_data: